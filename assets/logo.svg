<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Polymarket MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <!-- icon: odds chart inside a rounded tile -->
  <g transform="translate(90 60)">
    <rect width="180" height="180" rx="40" fill="#0b1220" stroke="url(#accent)" stroke-width="6"/>
    <rect x="34" y="96" width="24" height="50" rx="6" fill="#38bdf8"/>
    <rect x="78" y="64" width="24" height="82" rx="6" fill="#60a5fa"/>
    <rect x="122" y="34" width="24" height="112" rx="6" fill="#818cf8"/>
    <polyline points="40,84 90,56 134,28" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="134" cy="28" r="8" fill="#f8fafc"/>
  </g>
  <text x="320" y="145" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f8fafc">Polymarket <tspan fill="url(#accent)">MCP</tspan></text>
  <text x="324" y="205" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#94a3b8">Prediction-market odds for AI assistants, written in Swift</text>
</svg>
